<!-- Usamos a classe 'conteudo' para herdar exatamente o mesmo espaçamento e estilo das outras telas -->
<section class="conteudo">
    <h2>Acesso ao Painel Administrativo</h2>
    <p>Insira suas credenciais para gerenciar o conteúdo do site.</p>

    <form id="loginForm" style="margin-top: 20px; display: flex; flex-direction: column; max-width: 320px; gap: 15px;">
        <div>
            <label for="usuarioInput" style="display: block; margin-bottom: 5px; font-weight: bold;">Usuário:</label>
            <input type="text" id="usuarioInput" placeholder="Digite seu usuário" required style="width: 100%; padding: 8px; box-sizing: border-box;">
        </div>
        
        <div>
            <label for="senhaInput" style="display: block; margin-bottom: 5px; font-weight: bold;">Senha:</label>
            <input type="password" id="senhaInput" placeholder="Digite sua senha" required style="width: 100%; padding: 8px; box-sizing: border-box;">
        </div>

        <button type="submit" style="padding: 10px; background-color: #2e6930; color: white; border: none; cursor: pointer; font-weight: bold;">Entrar</button>
    </form>
</section>

<footer>
    <p>© 2025 Terê Verde Online</p>
</footer>

<!-- 1. Biblioteca do Supabase via CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
