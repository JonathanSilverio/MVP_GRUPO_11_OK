<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="/MVP_GRUPO_11_OK/css/style.css">
</head>
<body>
    <header>
        <h1>Login do Administrador</h1>
    </header>

    <section>
        <form id="loginForm">
            <input type="text" id="usuarioInput" placeholder="Usuário" required>
            <input type="password" id="senhaInput" placeholder="Senha" required>
            <button type="submit">Entrar</button>
        </form>

    <!-- 1. Biblioteca do Supabase via CDN -->

    <!-- 2. Seu arquivo de script local -->

</body>
</html>
