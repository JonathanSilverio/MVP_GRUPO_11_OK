<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Login - Terê Verde Online</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .login-container {
    max-width: 420px;
    margin: 60px auto;
    background: #ffffff;
    padding: 35px 40px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    border: 1px solid #e2e8f0;
  }

  .login-container h2 {
    color: #1e4d20;
    margin-top: 0;
    margin-bottom: 8px;
    font-size: 1.5rem;
  }

  .login-sub {
    color: #666;
    margin-bottom: 25px;
    font-size: 0.9rem;
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-group label {
    display: block;
    font-weight: bold;
    color: #2c3e50;
    margin-bottom: 6px;
    font-size: 0.9rem;
  }

  .login-container input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 1rem;
    box-sizing: border-box;
    background-color: #f8fafc;
  }

  .login-container input:focus {
    outline: none;
    border-color: #2e6930;
    background-color: #fff;
    box-shadow: 0 0 0 3px rgba(46, 105, 48, 0.1);
  }

  .btn-entrar {
    width: 100%;
    background-color: #2e6930;
    color: white;
    border: none;
    padding: 14px;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.2s;
    margin-top: 10px;
  }

  .btn-entrar:hover {
    background-color: #245226;
  }

  .footer-links {
    text-align: center;
    margin-top: 25px;
  }

  .footer-links a {
    color: #2e6930;
    text-decoration: none;
    font-weight: 600;
  }
</style>
</head>
<body>

<header>
    <h1>Login</h1>
    <nav>
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="parques.html">Parques</a></li>
            <li><a href="trilhas.html">Trilhas</a></li>
            <li><a href="biodiversidade.html">Biodiversidade</a></li>
            <li><a href="eventos.html">Eventos</a></li>
            <li><a href="login.html" class="active">Login</a></li>
        </ul>
    </nav>
</header>

<div class="login-container">
    <h2>Acesso ao Painel</h2>
    <p class="login-sub">Insira suas credenciais para gerenciar o conteúdo do site.</p>

    <div id="mensagemFeedback"></div>

    <form id="formLogin">
        <div class="form-group">
            <label for="usuario">Usuário</label>
            <input type="text" id="usuario" placeholder="Digite seu usuário" required>
        </div>

        <div class="form-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha" required>
        </div>

        <button type="submit" class="btn-entrar">Entrar</button>
    </form>

    <div class="footer-links">
        <a href="index.html">← Voltar para o site</a>
    </div>
</div>

<footer>
    <p>© 2025 Terê Verde Online</p>
</footer>

<script>
  // Se já estiver logado, nem perde tempo na tela de login, vai direto pro admin
  if (localStorage.getItem('tere_verde_logado') === 'true') {
    window.location.href = 'admin.html';
  }

  document.getElementById('formLogin').addEventListener('submit', function(e) {
    e.preventDefault();
    const user = document.getElementById('usuario').value;
    const pass = document.getElementById('senha').value;
    const feedback = document.getElementById('mensagemFeedback');

    // Credenciais simples de admin (você pode alterar aqui se quiser)
    if (user === 'admin' && pass === '123456') {
      localStorage.setItem('tere_verde_logado', 'true');
      feedback.innerHTML = '<div style="background: #d8eadf; color: #1a2e1b; padding: 12px; border-radius: 6px; margin-bottom: 20px; border-left: 5px solid #2e6930;">✅ Login realizado com sucesso! Redirecionando...</div>';
      setTimeout(() => {
        window.location.href = 'admin.html';
      }, 1000);
    } else {
      feedback.innerHTML = '<div style="background: #fde8e8; color: #9b1c1c; padding: 12px; border-radius: 6px; margin-bottom: 20px; border-left: 5px solid #dc2626;">❌ Usuário ou senha incorretos.</div>';
    }
  });
</script>

</body>
</html>
