<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Terê Verde Online</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Cadastro de Novo Usuário</h1>
    </header>

    <section>
        <form id="cadastroForm">
            <!-- Campos solicitados: login (nome), email e senha -->
            <input type="text" id="nomeInput" placeholder="Nome de Usuário (Login)" required>
            <input type="email" id="emailInput" placeholder="E-mail" required>
            <input type="password" id="senhaInput" placeholder="Senha" required>
            <button type="submit">Cadastrar</button>
        </form>
        <p><a href="login.html">Já tem uma conta? Faça login</a></p>
    </section>

    <!-- Biblioteca do Supabase via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Script de cadastro -->
    <script src="js/cadastro.js"></script>
</body>
</html>
