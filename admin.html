<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://hxbjzzcqrzqtwfbevbgq.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_KzosMDDebQMNjV3stt7hwg_2KrFxrTW';
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Converte de AAAA-MM-DD (banco) para DD/MM/AAAA (tela)
  function formataDataParaBR(dataStr) {
    if (!dataStr) return '';
    if (!dataStr.includes('-')) return dataStr;
    const partes = dataStr.split('-');
    if (partes.length === 3) {
      return `${partes[2]}/${partes[1]}/${partes[0]}`;
    }
    return dataStr;
  }

  // Converte de DD/MM/AAAA (formulário) para AAAA-MM-DD (banco)
  function formataDataParaBanco(dataStr) {
    if (!dataStr) return '';
    if (!dataStr.includes('/')) return dataStr;
    const partes = dataStr.split('/');
    if (partes.length === 3) {
      return `${partes[2]}-${partes[1]}-${partes[0]}`;
    }
    return dataStr;
  }

  async function carregarEventosAdmin() {
    const { data: eventos, error } = await _supabase
      .from('eventos')
      .select('*')
      .order('id', { ascending: false });

    const container = document.getElementById('listaAdminEventos');
    if (error) {
      container.innerHTML = '<p style="color: #c53030;">Erro ao carregar eventos.</p>';
      return;
    }
    if (!eventos || eventos.length === 0) {
      container.innerHTML = '<p style="color: #666; font-style: italic;">Nenhum evento cadastrado.</p>';
      return;
    }

    container.innerHTML = '';
    eventos.forEach(ev => {
      const dataBR = formataDataParaBR(ev.data);
      const horarioTexto = ev.horario ? ` | ⏰ ${ev.horario}` : '';
      
      container.innerHTML += `
        <div class="evento-item-admin">
            <div class="evento-info">
                <h4>${ev.titulo}</h4>
                <p><strong>Data:</strong> ${dataBR}${horarioTexto} | <strong>Local:</strong> ${ev.local}</p>
            </div>
            <div class="acoes-btns">
                <button class="btn-editar" onclick="prepararEdicao(${ev.id}, '${ev.titulo.replace(/'/g, "\\'")}', '${dataBR}', '${ev.horario || ''}', '${ev.local.replace(/'/g, "\\'")}', '${ev.descricao.replace(/'/g, "\\'")}')">Editar</button>
                <button class="btn-excluir" onclick="excluirEvento(${ev.id})">Excluir</button>
            </div>
        </div>
      `;
    });
  }

  document.getElementById('formEvento').addEventListener('submit', async function(e) {
    e.preventDefault();

    const id = document.getElementById('eventoId').value;
    const titulo = document.getElementById('titulo').value;
    const dataInput = document.getElementById('data').value;
    const data = formataDataParaBanco(dataInput); // Garante que vai no formato aceito pelo PostgreSQL
    const horario = document.getElementById('horario').value;
    const local = document.getElementById('local').value;
    const descricao = document.getElementById('descricao').value;
    const feedback = document.getElementById('mensagemFeedback');

    if (id) {
      const { error } = await _supabase
        .from('eventos')
        .update({ titulo, data, horario, local, descricao })
        .eq('id', id);

      if (error) { alert('Erro ao atualizar: ' + error.message); return; }
      feedback.innerHTML = '<div style="background: #d8eadf; color: #1a2e1b; padding: 12px; border-radius: 6px; margin-bottom: 20px; border-left: 5px solid #2e6930;">✅ Evento atualizado com sucesso!</div>';
      cancelarEdicao();
    } else {
      const { error } = await _supabase
        .from('eventos')
        .insert([{ titulo, data, horario, local, descricao }]);

      if (error) { alert('Erro ao cadastrar: ' + error.message); return; }
      feedback.innerHTML = '<div style="background: #d8eadf; color: #1a2e1b; padding: 12px; border-radius: 6px; margin-bottom: 20px; border-left: 5px solid #2e6930;">✅ Evento cadastrado com sucesso!</div>';
      document.getElementById('formEvento').reset();
    }

    carregarEventosAdmin();
    setTimeout(() => { feedback.innerHTML = ''; }, 4000);
  });

  function prepararEdicao(id, titulo, dataBR, horario, local, descricao) {
    document.getElementById('eventoId').value = id;
    document.getElementById('titulo').value = titulo;
    document.getElementById('data').value = dataBR; // Já preenche o input como DD/MM/AAAA
    document.getElementById('horario').value = horario;
    document.getElementById('local').value = local;
    document.getElementById('descricao').value = descricao;

    document.getElementById('btnSalvar').innerText = 'Atualizar Evento';
    document.getElementById('btnCancelar').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function cancelarEdicao() {
    document.getElementById('formEvento').reset();
    document.getElementById('eventoId').value = '';
    document.getElementById('btnSalvar').innerText = 'Salvar Evento';
    document.getElementById('btnCancelar').style.display = 'none';
  }

  async function excluirEvento(id) {
    if (!confirm('Deseja excluir este evento?')) return;
    const { error } = await _supabase.from('eventos').delete().eq('id', id);
    if (error) { alert('Erro: ' + error.message); return; }
    carregarEventosAdmin();
  }

  carregarEventosAdmin();
</script>
