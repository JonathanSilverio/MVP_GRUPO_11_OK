<section class="conteudo">
    <p>
        Aqui você encontra uma lista de eventos, ações e campanhas relacionadas à preservação ambiental, sustentabilidade e educação ecológica.
    </p>

    <h2>🌿 Próximos Eventos</h2>

    <!-- Onde os eventos cadastrados no painel vão aparecer dinamicamente -->
    <div id="listaEventos">
        <p>Carregando eventos...</p>
    </div>
</section>

<!-- Script para buscar os eventos do Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://hxbjzzcqrzqtwfbevbgq.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_KzosMDDebQMNjV3stt7hwg_2KrFxrTW';
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function carregarEventos() {
    const { data: eventos, error } = await _supabase
      .from('eventos')
      .select('*')
      .order('id', { ascending: false });

    const container = document.getElementById('listaEventos');
    
    if (error) {
      container.innerHTML = '<p>Erro ao carregar eventos.</p>';
      return;
    }

    if (eventos.length === 0) {
      container.innerHTML = '<p>Nenhum evento cadastrado no momento.</p>';
      return;
    }

    container.innerHTML = '';
    eventos.forEach(ev => {
      container.innerHTML += `
        <div class="evento-card" style="background: white; padding: 15px; margin-bottom: 15px; border-radius: 5px; border-left: 5px solid #2e6930;">
            <h3>${ev.titulo}</h3>
            <p><strong>Data:</strong> ${ev.data}</p>
            <p><strong>Descrição:</strong> ${ev.descricao}</p>
            <p><strong>Local:</strong> ${ev.local}</p>
        </div>
      `;
    });
  }

  carregarEventos();
</script>
